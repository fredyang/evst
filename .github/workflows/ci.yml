name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        eslint: [9, 10]
    env:
      HUSKY: "0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm install --no-save --package-lock=false --workspace @evst/eslint-plugin eslint@^${{ matrix.eslint }}
      - name: Check installed ESLint major
        working-directory: packages/eslint-plugin
        env:
          EXPECTED_ESLINT_MAJOR: ${{ matrix.eslint }}
        run: node -e 'const version = require("eslint/package.json").version; console.log(version); if (version.split(".")[0] !== process.env.EXPECTED_ESLINT_MAJOR) process.exit(1);'
      - run: npm run build --workspace @evst/ngrx-store
      - run: npm test --workspace @evst/eslint-plugin

  verify:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run docs:api
      - run: npx tsc --noEmit -p examples/projects/ngrx-books/tsconfig.app.json
      - run: npx tsc --noEmit -p examples/projects/ngrx-books-standalone/tsconfig.app.json
      - run: npx tsc --noEmit -p examples/projects/evst-ngrx-books/tsconfig.app.json
      - run: npx tsc --noEmit -p examples/projects/svc-books/tsconfig.app.json
      - run: npm run test:ngrx-books
      - run: npm run test:ngrx-books-standalone
      - run: npm run test:evst-ngrx-books
      - run: npm run lint:evst-ngrx-books
      - run: npm run lint:ngrx-books-standalone
      - run: npm run lint:svc-books
      - run: npm pack --workspaces --dry-run
